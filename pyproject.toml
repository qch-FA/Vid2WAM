[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2wam"
version = "0.1.0"
description = "Vid2WAM training and evaluation for LIBERO and RoboTwin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "einops>=0.8,<1",
  "huggingface-hub>=0.29,<1",
  "hydra-core>=1.3,<2",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "modelscope>=1.34,<2",
  "numpy>=1.26,<2",
  "omegaconf>=2.3,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "safetensors>=0.5,<1",
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "tqdm>=4.66,<5",
  "transformers>=4.49,<5",
]

[project.optional-dependencies]
teacher = [
  "lightning>=2.6,<2.7",
  "diffusers>=0.34,<0.35",
  "transformers>=4.51,<4.52",
  "peft>=0.15,<0.16",
  "sentencepiece>=0.2,<0.3",
  "ftfy>=6.3,<7",
  "h5py>=3.11,<4",
  "opencv-python>=4.10,<4.12",
  "decord==0.6.0",
  "av==14.0.1",
  "pyarrow>=15,<24",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "wandb>=0.19,<0.20",
  "wandb-osh>=1.2,<2",
  "colorama>=0.4,<1",
  "msgpack>=1,<2",
  "pyzmq>=26,<28",
  "easydict>=1.13,<2",
]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vid2wam*"]
namespaces = true
