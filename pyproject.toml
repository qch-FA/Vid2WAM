[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2wam"
version = "0.1.0"
description = "Vid2WAM evaluation for LIBERO and RoboTwin"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "einops>=0.8,<1",
  "huggingface-hub>=0.29,<1",
  "hydra-core>=1.3,<2",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "modelscope>=1.34,<2",
  "numpy>=1.26,<2",
  "omegaconf>=2.3,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "safetensors>=0.5,<1",
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "tqdm>=4.66,<5",
  "transformers>=4.49,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vid2wam*"]
namespaces = true
