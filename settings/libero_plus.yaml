# @package _global_

defaults:
  - evaluation
  - override /task: libero
  - _self_

ckpt: null
gpu_id: 0

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  all_trials: false
  output_dir: ./evaluate_results/libero_plus/${now:%Y%m%d_%H%M%S}

  libero_plus_root: ./third_party/LIBERO-plus
  perturbation_manifest_path: null
  perturbation_seed: 42

  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_rollout_video: false
  show_episode_progress: false

  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 1

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
